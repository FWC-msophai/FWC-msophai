<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>
    <table class="profile-card">
        <tr>
            <th>User Profile Card</th>
        </tr>
        <tr>
            <td>
                <img class="profile-picture" src="https://github.com/FWC-msophai.png" alt="Profile picture">
                <h2>FWC-msophai</h2>
                <p class="description">Web Development Student</p>
                <div class="social-icons">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v14/icons/github.svg" alt="GitHub">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v14/icons/facebook.svg" alt="Facebook">
                    <img src="https://cdn.jsdelivr.net/npm/simple-icons@v14/icons/instagram.svg" alt="Instagram">
                </div>
                <a class="contact-button" href="mailto:contact@example.com">Contact</a>
            </td>
        </tr>
    </table>
</body>
</html>
