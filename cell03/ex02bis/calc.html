<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator with jQuery</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>
    <form id="calculator">
        <input type="text" id="left-number" placeholder="Left number">
        <select id="operator">
            <option value="+">+</option>
            <option value="-">-</option>
            <option value="*">*</option>
            <option value="/">/</option>
            <option value="%">%</option>
        </select>
        <input type="text" id="right-number" placeholder="Right number">
        <input type="submit" value="Try me!">
    </form>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="calc.js"></script>
</body>
</html>
