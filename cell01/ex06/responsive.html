<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Responsive</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
        }
        table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }
        td {
            width: 50%;
            padding: 20px;
            word-wrap: break-word;
        }
        .left {
            background-color: lightblue;
        }
        .right {
            background-color: lightpink;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td class="left">Hello</td>
            <td class="right">World</td>
        </tr>
    </table>
</body>
</html>
